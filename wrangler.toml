"$schema" = "./node_modules/wrangler/config-schema.json"
name = "scholia-alexa-mcp"
main = "src/entry.py"
compatibility_date = "2026-05-29"
compatibility_flags = ["python_workers"]

# No public ingress by default. Deploying this Worker will not create a
# workers.dev URL, preview URLs are disabled, and no route/custom domain is set.
workers_dev = false
preview_urls = false
keep_vars = true

[assets]
directory = "./web/public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
# Comma-separated browser origins allowed to call /mcp with Authorization.
# Non-browser MCP clients normally omit Origin and are unaffected.
MCP_ALLOWED_ORIGINS = ""

# Local placeholder; replace with the provisioned ID before remote migration.
[[d1_databases]]
binding = "DECISIONS_DB"
database_name = "alexa-decisions"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[limits]
cpu_ms = 50

[[ratelimits]]
name = "SUBJECT_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

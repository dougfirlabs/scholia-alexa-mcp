"$schema" = "./node_modules/wrangler/config-schema.json"
name = "scholia-alexa-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Deployment is an operator step. workers.dev is enabled; preview URLs are
# disabled, and no route/custom domain is set.
workers_dev = true
preview_urls = false
keep_vars = true

[assets]
directory = "./web/public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
# Comma-separated browser origins allowed to call /mcp with Authorization.
# Non-browser MCP clients normally omit Origin and are unaffected.
MCP_ALLOWED_ORIGINS = ""

# Local placeholder; replace with the provisioned ID before remote migration.
[[d1_databases]]
binding = "DECISIONS_DB"
database_name = "alexa-decisions"
database_id = "d9d7b63b-0f15-4777-8d67-948c9d472b0b"
migrations_dir = "migrations"

[limits]
cpu_ms = 50

[[ratelimits]]
name = "SUBJECT_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
